name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  director-demo:
    name: Director demo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax
        run: |
          bash -n scripts/try-director.sh
          python3 -m json.tool scripts/director-demo.schema.json > /dev/null
      - name: Check usage error
        run: |
          status=0
          scripts/try-director.sh || status=$?
          test "$status" -eq 2
